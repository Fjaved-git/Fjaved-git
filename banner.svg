<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Fahad Javed - Flutter and Mobile Systems Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="1" stop-color="#0E1A3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02569B"/>
      <stop offset="0.55" stop-color="#13B9FD"/>
      <stop offset="1" stop-color="#00E5C3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#13B9FD" stop-opacity="0.35"/><stop offset="1" stop-color="#13B9FD" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#00E5C3" stop-opacity="0.25"/><stop offset="1" stop-color="#00E5C3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="200" cy="90" r="220" fill="url(#glowA)">
    <animate attributeName="cx" values="200;300;200" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;140;90" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="260" r="200" fill="url(#glowB)">
    <animate attributeName="cx" values="1000;900;1000" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- logo mark -->
  <g transform="translate(80,80) scale(0.625)">
    <rect width="256" height="256" rx="58" fill="url(#accent)"/>
    <rect width="256" height="128" rx="58" fill="url(#shine)"/>
    <g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <path pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" d="M66 192V64H126">
        <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.2s" dur="0.7s" fill="freeze"/>
      </path>
      <path pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" d="M66 126H114">
        <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.7s" dur="0.4s" fill="freeze"/>
      </path>
      <path pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" d="M190 64V150Q190 192 150 192H142">
        <animate attributeName="stroke-dashoffset" from="100" to="0" begin="0.9s" dur="0.8s" fill="freeze"/>
      </path>
    </g>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.5s" dur="0.9s" fill="freeze"/>
      <text x="280" y="152" font-size="60" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Fahad Javed</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.9s" dur="0.9s" fill="freeze"/>
      <text x="282" y="194" font-size="24" font-weight="500" fill="#38BDF8">Flutter &amp; Mobile Systems Engineer</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.3s" dur="0.9s" fill="freeze"/>
      <text x="282" y="230" font-size="17" fill="#94A3B8">Production-grade cross-platform apps people enjoy opening.</text>
    </g>
  </g>

  <!-- floating phone -->
  <g transform="translate(940,42)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="5s" repeatCount="indefinite"/>
      <rect width="170" height="240" rx="30" fill="#0B1226" stroke="url(#accent)" stroke-width="2.5"/>
      <rect x="60" y="11" width="50" height="8" rx="4" fill="#1E293B"/>
      <rect x="20" y="42" width="90" height="10" rx="5" fill="#38BDF8" opacity="0.9"/>
      <rect x="20" y="66" width="130" height="56" rx="12" fill="#16213E"/>
      <circle cx="46" cy="94" r="13" fill="url(#accent)"/>
      <rect x="68" y="84" width="66" height="7" rx="3.5" fill="#475569"/>
      <rect x="68" y="98" width="42" height="7" rx="3.5" fill="#334155"/>
      <rect x="20" y="132" width="130" height="56" rx="12" fill="#16213E">
        <animate attributeName="opacity" values="1;0.55;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="46" cy="160" r="13" fill="#00E5C3" opacity="0.85"/>
      <rect x="68" y="150" width="58" height="7" rx="3.5" fill="#475569"/>
      <rect x="68" y="164" width="36" height="7" rx="3.5" fill="#334155"/>
      <circle cx="50" cy="216" r="5" fill="#38BDF8"/>
      <circle cx="85" cy="216" r="5" fill="#334155"/>
      <circle cx="120" cy="216" r="5" fill="#334155"/>
    </g>
  </g>

  <!-- bottom accent line -->
  <rect y="316" width="1200" height="4" fill="url(#accent)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
